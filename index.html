<!DOCTYPE html>

<body>
<div class="wrap">

<h1>🎬 Jigsaw Fauji — AI Car Video Prompt</h1>
<div class="sub">Photorealistic cinematic Mercedes commercial • Strict Face Lock • Video 1 motion reference</div>
<textarea id="prompt" readonly>Use Video 1 as the exact reference for motion, performance, camera movement, framing, timing, pacing, gestures, body language and overall choreography. Use Image 1 and Image 2 ONLY as character identity and appearance references.

CHARACTER IDENTITY — STRICT FACE LOCK

Preserve the character's exact facial identity throughout the entire video. The character must remain the same person as shown in Image 1 and Image 2 in every frame.

Preserve the exact face shape, forehead, eyebrows, eyes, nose, lips, cheek structure, jawline, chin, beard, skin tone, natural skin texture, hairline and hairstyle.

DO NOT redesign, beautify, smooth, sharpen, reshape, reconstruct, reinterpret or alter the face.

No face replacement. No identity drift. No facial morphing. No face warping. No facial deformation. No artificial beautification. No age change. No change in facial proportions.

The face must remain visually consistent and recognizable as the exact same person from Image 1 and Image 2 from the first frame to the last frame.

OUTFIT & APPEARANCE

Preserve the exact outfit shown in the character references:
- White blazer
- Dark brown shirt
- Black sunglasses
- Same hairstyle
- Same overall appearance

Keep clothing colors, textures, patterns, fit, proportions and details accurate and consistent throughout the entire video. Do not change, replace or redesign the outfit.

PERFORMANCE & CHOREOGRAPHY

Recreate the performance from Video 1 as closely as possible.

Match the reference video precisely in body movements, walking/movement pattern, hand gestures, arm movements, head movements, shoulder movements, body posture, facial performance, gesture timing, movement rhythm, pacing and overall choreography.

Do not invent new movements or add unnecessary gestures. The character should perform the same actions at the same moments as in Video 1.

FACIAL PERFORMANCE

Keep the expression cool, confident, natural and controlled.

Do NOT create a big smile, exaggerated grin, laughing expression, goofy expression, overacting or artificially dramatic facial expressions.

Maintain a subtle, relaxed expression with a slight natural smirk only when it exists in Video 1.

Keep mouth movements restrained and realistic. Maintain accurate facial proportions during every head movement. Keep natural eye direction, realistic blinking, subtle facial movement, natural lip movement and realistic mouth motion.

Do not change the jawline, nose, eyes, lips, beard or overall facial structure during movement.

CAMERA & FRAMING

Use Video 1 as the exact camera reference.

Match camera angle, camera height, camera distance, perspective, framing, subject position, camera movement, camera speed, camera direction, zoom/push-in/pull-out and tracking movement.

Do not introduce new camera angles or unnecessary cinematic movements that are not present in Video 1.

MOTION QUALITY

Create realistic human movement matching Video 1.

Hands and fingers must remain anatomically correct. Avoid distorted hands, extra fingers, missing fingers, deformed arms, broken wrists, rubber-like limbs, unnatural body bending, floating/sliding feet, jerky movement or sudden position changes.

Maintain realistic body proportions and natural physics throughout the entire video.

VISUAL STYLE

Create photorealistic cinematic footage with natural skin texture, realistic lighting, realistic shadows, accurate reflections, detailed fabric texture, natural depth of field, high dynamic range, sharp but realistic details, professional DSLR/cinematic camera quality and smooth natural camera movement.

Use a premium luxury-car commercial aesthetic.

The final video should look like a real professionally filmed Mercedes commercial, not an AI-generated animation.

Maintain realistic lighting and reflections on the vehicle, sunglasses, clothing and surrounding environment.

TEMPORAL CONSISTENCY

Maintain complete visual consistency from the first frame to the final frame.

The character's face, hair, beard, sunglasses, outfit, body proportions, skin tone and identity must remain consistent throughout the entire video.

No flickering. No identity changes. No sudden face changes. No clothing changes. No hairstyle changes. No inconsistent body proportions.

FINAL QUALITY CONTROL

Prioritize the following:
1. Exact character identity and face preservation
2. Exact motion and choreography from Video 1
3. Accurate outfit and appearance
4. Natural human movement
5. Accurate camera movement and framing
6. Photorealistic cinematic quality

The final result must appear as if the same real person from Image 1 and Image 2 was physically filmed performing the exact performance from Video 1.

Do not alter the person's identity or facial appearance under any circumstances.</textarea>

<button class="copy" onclick="copyPrompt()">📋 Copy Prompt</button>
<button class="share" onclick="sharePage()">🔗 Share</button>
<span class="status" id="status"></span>
<div class="footer">Jigsaw Fauji • AI Video Prompt</div>
</div>
</div>
<script>
async function copyPrompt(){
 const t=document.getElementById('prompt').value;
 await navigator.clipboard.writeText(t);
 document.getElementById('status').textContent='Copied!';
 setTimeout(()=>document.getElementById('status').textContent='',1800);
}
async function sharePage(){
 if(navigator.share) await navigator.share({title:document.title,text:'Jigsaw Fauji — AI Car Video Prompt',url:location.href});
 else {await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='Page link copied!';}
}
</script>
